document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex ccent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: order-radius: 0; box-shadow: none; border: 1px solid var(--color-divider); }\n    .leaflet-popup-tip { display: none; }\n    .leaflet-container a.leaflet-popup-close-button { color: var(--color-text); }\n    .hark-popup .name { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 14px; margin-bottom: 2px; }\n    .hark-popup .meta { font-family: 'Roboto Mono', ui-monospace, monospace; font-size: 11px; opacity: 0.7; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:var(--color-bg); color:var(--color-text); font-family:var(--font-body); min-height:100vh; --font-mono:'Roboto Mono', ui-monospace, monospace;\">\n\n  <div style=\"display:flex; gap:var(--space-8); max-width:1000px; margin:0 auto; padding:0 var(--space-4); align-items:flex-start;\">\n\n    <aside style=\"width:160px; flex-shrink:0; position:sticky; top:var(--space-6); padding-top:var(--space-8);\">\n      <nav aria-label=\"Sections\">\n        <ol style=\"list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:var(--space-1);\">\n          <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"5\">\n            <li>\n              <a href=\"{{ item.hash }}\" style=\"display:block; padding:var(--space-2) 0 var(--space-2) var(--space-3); border-left:2px solid {{ item.borderColor }}; color:{{ item.color }}; font-weight:{{ item.weight }}; font-size:13px; font-family:var(--font-mono); text-decoration:none;\" style-hover=\"color:var(--color-accent-900);\">{{ item.n }}. {{ item.label }}<\u002Fa>\n            <\u002Fli>\n          <\u002Fsc-for>\n        <\u002Fol>\n      <\u002Fnav>\n    <\u002Faside>\n\n    <main style=\"max-width:720px; flex:1; min-width:0; padding:var(--space-8) 0 calc(var(--space-8) * 2); line-height:1.6;\">\n\n<header>\n      <h1 style=\"margin:0 0 2px;\">Harker Ornithology Report<\u002Fh1>\n      <div style=\"font-family:var(--font-mono); font-size:13px; opacity:0.7;\">Felipe Harker · Observer<\u002Fdiv>\n\n      <div style=\"margin-top:var(--space-6); padding-top:var(--space-6); border-top:2px solid var(--color-divider);\">\n        <div class=\"hk-label\" style=\"margin-bottom:var(--space-2);\">Abstract<\u002Fdiv>\n        <p style=\"max-width:68ch; font-size:16px; margin:0;\">This project catalogs and shares birding observations from around the world, with checklists and media hosted on eBird and the Macaulay Library. It began as an experiment merging a love of birds with web development, and remains under active, frequent development.<\u002Fp>\n      <\u002Fdiv>\n\n    <\u002Fheader>\n\n    <section id=\"sec-map\" style=\"margin-top:var(--space-8); padding-top:var(--space-6); border-top:2px solid var(--color-divider);\">\n      <div style=\"display:flex; align-items:baseline; gap:var(--space-3);\">\n        <span style=\"font-family:var(--font-mono); font-size:15px; opacity:0.5;\">1.<\u002Fspan>\n        <h2 style=\"margin:0;\">Map<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"width:100%; height:480px; border:1px solid var(--color-divider); margin-top:var(--space-4);\">\n        <div id=\"hark-map\" style=\"width:100%; height:100%;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hk-figcap\" style=\"margin-top:var(--space-2);\">Figure 1 — {{ locationCount }} locations plotted from recorded coordinates.<\u002Fdiv>\n\n      <sc-if value=\"{{ selectedLocation }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:var(--space-4); padding-top:var(--space-4); border-top:1px solid var(--color-divider);\">\n          <div class=\"hk-label\">Selected<\u002Fdiv>\n          <h3 style=\"margin:var(--space-1) 0 var(--space-1);\">{{ selectedLocation.name }}<\u002Fh3>\n          <p style=\"margin:0 0 var(--space-2); font-family:var(--font-mono); font-size:13px; opacity:0.7;\">{{ selectedLocation.place }} · {{ selectedLocation.count }} observations<\u002Fp>\n          <a href=\"#sec-locations\">View in Location Index →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <section id=\"sec-locations\" style=\"margin-top:var(--space-8); padding-top:var(--space-6); border-top:2px solid var(--color-divider);\">\n      <div style=\"display:flex; align-items:baseline; gap:var(--space-3);\">\n        <span style=\"font-family:var(--font-mono); font-size:15px; opacity:0.5;\">2.<\u002Fspan>\n        <h2 style=\"margin:0;\">Locations<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"field\" style=\"position:relative; margin-top:var(--space-4); max-width:340px;\">\n        <label for=\"hd-filter\" style=\"position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);\">Filter locations by name<\u002Flabel>\n        <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"position:absolute; left:10px; top:11px; opacity:0.5; pointer-events:none;\"><path d=\"m21 21-4.34-4.34\"><\u002Fpath><circle cx=\"11\" cy=\"11\" r=\"8\"><\u002Fcircle><\u002Fsvg>\n        <input id=\"hd-filter\" class=\"input\" style=\"padding-left:32px;\" placeholder=\"Filter locations by name…\" value=\"{{ locationFilter }}\" sc-camel-on-change=\"{{ onFilterChange }}\">\n      <\u002Fdiv>\n\n      <sc-raw-table class=\"table\" style=\"margin-top:var(--space-4);\">\n        <sc-raw-thead><sc-raw-tr><sc-raw-th>Location<\u002Fsc-raw-th><sc-raw-th>Place<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\">Obs.<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-for list=\"{{ filteredLocations }}\" as=\"loc\" hint-placeholder-count=\"4\">\n            <sc-raw-tr sc-camel-on-click=\"{{ loc.onSelect }}\" style=\"cursor:pointer; border-left:{{ loc.rowBorder }};\" style-hover=\"background:var(--color-surface);\">\n              <sc-raw-td>\n                <strong>{{ loc.name }}<\u002Fstrong>\n                <sc-if value=\"{{ loc.hotspot }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span class=\"tag tag-neutral\" style=\"margin-left:var(--space-2);\">Hotspot<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fsc-raw-td>\n              <sc-raw-td style=\"font-family:var(--font-mono); font-size:13px;\">{{ loc.place }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"text-align:right; font-family:var(--font-mono);\">{{ loc.count }}<\u002Fsc-raw-td>\n            <\u002Fsc-raw-tr>\n            <sc-if value=\"{{ loc.isSelected }}\" hint-placeholder-val=\"{{ false }}\">\n              <sc-raw-tr>\n                <sc-raw-td colspan=\"3\" style=\"background:var(--color-surface); padding:0;\">\n                  <div style=\"padding:var(--space-4) var(--space-3);\">\n\n                    <div class=\"hk-label\" style=\"margin-bottom:var(--space-2);\">Checklists<\u002Fdiv>\n                    <sc-if value=\"{{ selectedDetail.checklists.length }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div style=\"margin-bottom:var(--space-6);\">\n                        <sc-for list=\"{{ selectedDetail.checklists }}\" as=\"cl\" hint-placeholder-count=\"2\">\n                          <div style=\"display:flex; gap:var(--space-3); align-items:baseline; padding:var(--space-2) 0; border-bottom:1px solid var(--color-divider); font-size:13px;\">\n                            <span style=\"font-family:var(--font-mono); width:170px; flex-shrink:0;\">{{ cl.date }} {{ cl.time }}<\u002Fspan>\n                            <a href=\"{{ cl.href }}\" target=\"_blank\" rel=\"noopener noreferrer\">Checklist on eBird →<\u002Fa>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n\n                    <div class=\"hk-label\" style=\"margin-bottom:var(--space-2);\">Species Observed<\u002Fdiv>\n                    <sc-raw-table class=\"table\" style=\"background:var(--color-bg);\">\n                      <sc-raw-thead><sc-raw-tr><sc-raw-th>Species<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\">Total<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n                      <sc-raw-tbody>\n                        <sc-for list=\"{{ selectedDetail.species }}\" as=\"sp\" hint-placeholder-count=\"3\">\n                          <sc-raw-tr>\n                            <sc-raw-td>\n                              <div>{{ sp.common }}<\u002Fdiv>\n                              <div style=\"font-family:var(--font-mono); font-style:italic; font-size:12px; opacity:0.6;\">{{ sp.sci }}<\u002Fdiv>\n                            <\u002Fsc-raw-td>\n                            <sc-raw-td style=\"text-align:right; font-family:var(--font-mono);\">{{ sp.displayTotal }}<\u002Fsc-raw-td>\n                          <\u002Fsc-raw-tr>\n                        <\u002Fsc-for>\n                      <\u002Fsc-raw-tbody>\n                    <\u002Fsc-raw-table>\n                    <div class=\"hk-figcap\" style=\"margin-top:var(--space-2);\">Table — species totals at {{ selectedDetail.name }}.<\u002Fdiv>\n\n                    <div class=\"hk-label\" style=\"margin:var(--space-6) 0 var(--space-2);\">Observations over Time<\u002Fdiv>\n                    <svg width=\"100%\" height=\"70\" sc-camel-view-box=\"0 0 220 56\" sc-camel-preserve-aspect-ratio=\"none\" style=\"display:block; border:1px solid var(--color-divider); background:var(--color-bg);\">\n                      <polyline points=\"0,44 30,40 60,30 90,34 120,18 150,22 180,8 220,14\" fill=\"none\" stroke=\"var(--color-text)\" stroke-width=\"2\"><\u002Fpolyline>\n                      <circle cx=\"220\" cy=\"14\" r=\"3\" fill=\"var(--color-text)\"><\u002Fcircle>\n                    <\u002Fsvg>\n                    <div class=\"hk-figcap\" style=\"margin-top:var(--space-2);\">Figure — cumulative observations at {{ selectedDetail.name }}.<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-if>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n      <div class=\"hk-figcap\" style=\"margin-top:var(--space-2);\">Table 1 — study locations and total observations recorded.<\u002Fdiv>\n      <sc-if value=\"{{ noLocationsMatch }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"font-family:var(--font-mono); opacity:0.55; font-style:italic; margin-top:var(--space-3);\">No locations match “{{ locationFilter }}”.<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <section id=\"sec-media\" style=\"margin-top:var(--space-8); padding-top:var(--space-6); border-top:2px solid var(--color-divider);\">\n      <div style=\"display:flex; align-items:baseline; gap:var(--space-3);\">\n        <span style=\"font-family:var(--font-mono); font-size:15px; opacity:0.5;\">3.<\u002Fspan>\n        <h2 style=\"margin:0;\">Media<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"margin-top:var(--space-4); display:flex; flex-direction:column; gap:var(--space-6);\">\n        <sc-for list=\"{{ mediaGroups }}\" as=\"grp\" hint-placeholder-count=\"2\">\n          <div>\n            <div style=\"display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid var(--color-divider); padding-bottom:var(--space-2); margin-bottom:var(--space-3);\">\n              <div style=\"font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:16px;\">{{ grp.location }}<\u002Fdiv>\n              <div style=\"font-family:var(--font-mono); font-size:12px; display:flex; gap:var(--space-3); align-items:center;\">\n                <span>{{ grp.date }} {{ grp.time }}<\u002Fspan>\n                <a href=\"{{ grp.href }}\" target=\"_blank\" rel=\"noopener noreferrer\">Checklist on eBird →<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:var(--space-4);\">\n              <sc-for list=\"{{ grp.items }}\" as=\"item\" hint-placeholder-count=\"2\">\n                <figure style=\"margin:0;\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ item.onOpen }}\" style=\"display:block; width:100%; padding:0; border:1px solid var(--color-divider); background:none; cursor:pointer;\" style-hover=\"border-color:var(--color-accent);\">\n                    <div style=\"aspect-ratio:1;\"><image-slot id=\"{{ item.slotId }}\" shape=\"rect\" placeholder=\"Photo\"><\u002Fimage-slot><\u002Fdiv>\n                  <\u002Fbutton>\n                  <figcaption class=\"hk-figcap\" style=\"margin-top:var(--space-1);\">Fig. {{ item.fig }} — {{ item.common }}<\u002Ffigcaption>\n                <\u002Ffigure>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"sec-notes\" style=\"margin-top:var(--space-8); padding-top:var(--space-6); border-top:2px solid var(--color-divider);\">\n      <div style=\"display:flex; align-items:baseline; gap:var(--space-3);\">\n        <span style=\"font-family:var(--font-mono); font-size:15px; opacity:0.5;\">4.<\u002Fspan>\n        <h2 style=\"margin:0;\">Field Notes<\u002Fh2>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:var(--space-4); display:flex; flex-direction:column; gap:var(--space-6);\">\n        <sc-for list=\"{{ notes }}\" as=\"note\" hint-placeholder-count=\"2\">\n          <div>\n            <div style=\"display:flex; align-items:baseline; gap:var(--space-2);\">\n              <span style=\"font-family:var(--font-mono); font-size:13px; opacity:0.5;\">4.{{ note.n }}<\u002Fspan>\n              <h3 style=\"margin:0;\">{{ note.title }}<\u002Fh3>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:var(--space-1); font-family:var(--font-mono); font-size:13px; opacity:0.8; border-bottom:1px solid var(--color-divider); padding-bottom:var(--space-3); margin:var(--space-2) 0 var(--space-3);\">\n              <div><strong style=\"opacity:0.6;\">Date&nbsp;<\u002Fstrong>{{ note.date }}<\u002Fdiv>\n              <div><strong style=\"opacity:0.6;\">Location&nbsp;<\u002Fstrong>{{ note.location }}<\u002Fdiv>\n              <div><strong style=\"opacity:0.6;\">Conditions&nbsp;<\u002Fstrong>{{ note.conditions }}<\u002Fdiv>\n              <sc-if value=\"{{ note.hasLinks }}\" hint-placeholder-val=\"{{ false }}\">\n                <div>\n                  <strong style=\"opacity:0.6;\">Links&nbsp;<\u002Fstrong>\n                  <sc-for list=\"{{ note.links }}\" as=\"link\" hint-placeholder-count=\"1\">\n                    <a href=\"{{ link }}\" target=\"_blank\" rel=\"noopener noreferrer\">{{ link }}<\u002Fa>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-if value=\"{{ note.body }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin:0; max-width:68ch;\">{{ note.body }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"sec-refs\" style=\"margin-top:var(--space-8); padding-top:var(--space-6); border-top:2px solid var(--color-divider);\">\n      <div style=\"display:flex; align-items:baseline; gap:var(--space-3);\">\n        <span style=\"font-family:var(--font-mono); font-size:15px; opacity:0.5;\">5.<\u002Fspan>\n        <h2 style=\"margin:0;\">Reference<\u002Fh2>\n      <\u002Fdiv>\n      <ol style=\"list-style:none; padding:0; margin:var(--space-4) 0 0; display:flex; flex-direction:column; gap:var(--space-3);\">\n        <sc-for list=\"{{ aboutLinks }}\" as=\"link\" hint-placeholder-count=\"4\">\n          <li style=\"display:flex; gap:var(--space-3); align-items:baseline;\">\n            <span style=\"font-family:var(--font-mono); font-size:13px; opacity:0.5; flex-shrink:0;\">[{{ link.n }}]<\u002Fspan>\n            <span>\n              <a href=\"{{ link.href }}\" target=\"_blank\" rel=\"noopener noreferrer\">{{ link.label }}<\u002Fa>\n              <span style=\"font-size:14px; opacity:0.75;\"> — {{ link.desc }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fli>\n        <\u002Fsc-for>\n      <\u002Fol>\n    <\u002Fsection>\n\n    <footer style=\"margin-top:var(--space-8); padding-top:var(--space-4); border-top:2px solid var(--color-divider); font-family:var(--font-mono); font-size:11px; opacity:0.55;\">\n      Data current as of {{ latestChecklist }}. Compiled from eBird checklist exports — <a href=\"https://github.com/felipeharker/hark-ornithology\" target=\"_blank\" rel=\"noopener noreferrer\">source on GitHub<\u002Fa>.\n    <\u002Ffooter>\n\n    <\u002Fmain>\n\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ lightbox }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--color-neutral-900) 90%, transparent);\" sc-camel-on-click=\"{{ onCloseLightbox }}\">\n      <button type=\"button\" aria-label=\"Close\" sc-camel-on-click=\"{{ onCloseLightbox }}\" style=\"position:absolute; top:16px; right:16px; background:none; border:none; color:var(--color-bg); cursor:pointer; padding:8px;\">\n        <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6 6 18\"><\u002Fpath><path d=\"m6 6 12 12\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n      <button type=\"button\" aria-label=\"Previous\" sc-camel-on-click=\"{{ onPrevImage }}\" style=\"position:absolute; left:16px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--color-bg); cursor:pointer; padding:8px;\">\n        <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"15 18 9 12 15 6\"><\u002Fpolyline><\u002Fsvg>\n      <\u002Fbutton>\n      <button type=\"button\" aria-label=\"Next\" sc-camel-on-click=\"{{ onNextImage }}\" style=\"position:absolute; right:16px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--color-bg); cursor:pointer; padding:8px;\">\n        <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"9 18 15 12 9 6\"><\u002Fpolyline><\u002Fsvg>\n      <\u002Fbutton>\n      <div style=\"width:min(420px, 70vw); height:min(420px, 60vh);\" sc-camel-on-click=\"{{ stopPropagation }}\">\n        <image-slot id=\"hd-lightbox\" shape=\"rect\" placeholder=\"Photo\"><\u002Fimage-slot>\n        <div style=\"text-align:center; margin-top:var(--space-3); color:var(--color-bg); font-family:var(--font-mono); font-size:13px;\">\n          {{ lightbox.current.common }} <span style=\"opacity:0.7; font-style:italic;\">{{ lightbox.current.sci }}<\u002Fspan>\n          <div style=\"opacity:0.6; font-size:11px; margin-top:4px;\">{{ lightbox.position }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { selectedLocationId: null, locationFilter: '', lightbox: null, activeSection: 'sec-map' };\n  sectionIds = ['sec-map', 'sec-locations', 'sec-media', 'sec-notes', 'sec-refs'];\n\n  componentDidMount() {\n    window.addEventListener('keydown', this.handleKeyDown);\n\n    this.observer = new IntersectionObserver((entries) => {\n      entries.forEach((entry) => {\n        if (entry.isIntersecting) this.setState({ activeSection: entry.target.id });\n      });\n    }, { rootMargin: '-10% 0px -75% 0px', threshold: 0 });\n    this.sectionIds.forEach((id) => {\n      const el = document.getElementById(id);\n      if (el) this.observer.observe(el);\n    });\n\n    this.initMap();\n    this.waitForData();\n  }\n\n  waitForData = (attempt = 0) => {\n    if (window.HarkData) { this.forceUpdate(); return; }\n    if (attempt < 60) setTimeout(() => this.waitForData(attempt + 1), 100);\n  };\n  componentWillUnmount() {\n    window.removeEventListener('keydown', this.handleKeyDown);\n    if (this.observer) this.observer.disconnect();\n  }\n\n  initMap = (attempt = 0) => {\n    const el = document.getElementById('hark-map');\n    const D = window.HarkData;\n    if (!el || !window.L || !D) {\n      if (attempt < 40) setTimeout(() => this.initMap(attempt + 1), 150);\n      return;\n    }\n    if (this.map) return;\n    const locations = D.locations || [];\n    const map = window.L.map(el, { scrollWheelZoom: false });\n    this.map = map;\n    window.L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {\n      subdomains: 'abcd',\n      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',\n      maxZoom: 18,\n    }).addTo(map);\n    if (locations.length) {\n      map.fitBounds(window.L.latLngBounds(locations.map((l) => [l.lat, l.lng])), { padding: [50, 50] });\n    } else {\n      map.setView([38, -95], 4);\n    }\n    locations.forEach((loc) => {\n      const count = D.countForLocation(loc.id);\n      window.L.circleMarker([loc.lat, loc.lng], {\n        radius: 7, weight: 2, color: '#f3f2f2', fillColor: '#ec3013', fillOpacity: 1,\n      }).addTo(map).bindPopup(\n        '<div class=\"hark-popup\"><div class=\"name\">' + loc.name + '<\u002Fdiv>' +\n        '<div class=\"meta\">' + loc.place + ' \\u00b7 ' + count + ' obs' + (loc.hotspot ? ' \\u00b7 Hotspot' : '') + '<\u002Fdiv><\u002Fdiv>'\n      ).on('click', () => this.setState({ selectedLocationId: loc.id }));\n    });\n    setTimeout(() => map.invalidateSize(), 200);\n  };\n\n  handleKeyDown = (e) => {\n    if (!this.state.lightbox) return;\n    if (e.key === 'Escape') this.closeLightbox();\n    if (e.key === 'ArrowRight') this.nextImage();\n    if (e.key === 'ArrowLeft') this.prevImage();\n  };\n\n  selectLocation = (id) => this.setState((s) => ({ selectedLocationId: s.selectedLocationId === id ? null : id }));\n  setFilter = (v) => this.setState({ locationFilter: v });\n  openLightbox = (items, index) => this.setState({ lightbox: { items, index } });\n  closeLightbox = () => this.setState({ lightbox: null });\n  nextImage = () => this.setState((s) => ({ lightbox: { items: s.lightbox.items, index: (s.lightbox.index + 1) % s.lightbox.items.length } }));\n  prevImage = () => this.setState((s) => ({ lightbox: { items: s.lightbox.items, index: (s.lightbox.index - 1 + s.lightbox.items.length) % s.lightbox.items.length } }));\n\n  formatDate(iso) {\n    const d = new Date(iso + 'T00:00:00');\n    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });\n  }\n\n  renderVals() {\n    const D = window.HarkData || { locations: [], checklists: {}, fieldNotes: [], aboutLinks: [], checklistsForLocation: () => [], speciesTotalsForLocation: () => [], countForLocation: () => 0, allMediaGroups: () => [], latestChecklistDate: () => '', lifeListSize: () => 0 };\n    const { selectedLocationId, locationFilter, lightbox } = this.state;\n\n    const ebird = (id) => 'https://ebird.org/checklist/' + id;\n    const allChecklists = Object.keys(D.checklists).map((id) => D.checklists[id]);\n    const dates = allChecklists.map((c) => c.date).sort();\n\n    const decorated = D.locations.map((loc) => {\n      const isSelected = loc.id === selectedLocationId;\n      return {\n        ...loc,\n        count: D.countForLocation(loc.id),\n        isSelected,\n        rowBorder: isSelected ? '2px solid var(--color-accent)' : '2px solid transparent',\n        onSelect: () => this.selectLocation(loc.id),\n      };\n    });\n\n    const filteredLocations = decorated\n      .filter((l) => l.name.toLowerCase().includes(locationFilter.trim().toLowerCase()))\n      .sort((a, b) => {\n        if (selectedLocationId) {\n          if (a.id === selectedLocationId) return -1;\n          if (b.id === selectedLocationId) return 1;\n        }\n        if (b.count !== a.count) return b.count - a.count;\n        return a.name.localeCompare(b.name);\n      });\n\n    const selectedLocation = decorated.find((l) => l.isSelected) || null;\n    const selectedDetail = selectedLocation ? {\n      ...selectedLocation,\n      checklists: D.checklistsForLocation(selectedLocation.id).map((c) => ({ ...c, href: ebird(c.id) })),\n      species: D.speciesTotalsForLocation(selectedLocation.id).map((sp) => ({ ...sp, displayTotal: sp.onlyX ? 'X' : sp.total })),\n    } : null;\n\n    const notes = D.fieldNotes.map((n, i) => ({ ...n, n: i + 1, hasLinks: !!(n.links && n.links.length) }));\n\n    let figN = 0;\n    const mediaGroups = D.allMediaGroups().map((g) => ({\n      ...g,\n      href: ebird(g.id),\n      items: g.media.map((m, i) => { figN += 1; return { ...m, fig: figN, slotId: 'media-' + g.id + '-' + i, onOpen: () => this.openLightbox(g.media, i) }; }),\n    }));\n\n    const aboutLinks = (D.aboutLinks || [])\n      .filter((l) => /^https?:/.test(l.href))\n      .map((l, i) => ({ ...l, n: i + 1 }));\n\n    const sectionMeta = [\n      { id: 'sec-map', label: 'Map' },\n      { id: 'sec-locations', label: 'Locations' },\n      { id: 'sec-media', label: 'Media' },\n      { id: 'sec-notes', label: 'Field Notes' },\n      { id: 'sec-refs', label: 'Reference' },\n    ];\n    const navItems = sectionMeta.map((s, i) => {\n      const active = s.id === this.state.activeSection;\n      return {\n        n: i + 1,\n        label: s.label,\n        hash: '#' + s.id,\n        active,\n        color: active ? 'var(--color-accent-700)' : 'var(--color-text)',\n        weight: active ? 700 : 400,\n        borderColor: active ? 'var(--color-accent)' : 'transparent',\n      };\n    });\n\n    const lightboxView = lightbox ? {\n      current: lightbox.items[lightbox.index],\n      position: (lightbox.index + 1) + ' of ' + lightbox.items.length,\n    } : null;\n\n    return {\n      siteTitle: D.siteTitle || 'Harker Ornithology Report',\n      checklistCount: allChecklists.length,\n      locationCount: D.locations.length,\n      lifeListSize: D.lifeListSize(),\n      firstDate: dates.length ? this.formatDate(dates[0]) : '—',\n      lastDate: dates.length ? this.formatDate(dates[dates.length - 1]) : '—',\n      latestChecklist: D.latestChecklistDate(),\n      locationFilter,\n      onFilterChange: (e) => this.setFilter(e.target.value),\n      filteredLocations,\n      noLocationsMatch: filteredLocations.length === 0,\n      selectedLocation,\n      selectedDetail,\n      mediaGroups,\n      notes,\n      aboutIntro: D.aboutIntro,\n      aboutLinks,\n      navItems,\n      lightbox: lightboxView,\n      onCloseLightbox: this.closeLightbox,\n      onNextImage: this.nextImage,\n      onPrevImage: this.prevImage,\n      stopPropagation: (e) => e.stopPropagation(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
