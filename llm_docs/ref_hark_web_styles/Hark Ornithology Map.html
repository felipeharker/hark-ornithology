<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map</title>
<link rel="stylesheet" href="_ds/modernist-28127e47-e5c5-4bd3-9e86-60a13508662d/styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="./hark-data.js"></script>
<style>
  html, body, #map { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--color-bg); }
  .leaflet-tile-pane { filter: grayscale(0.3) brightness(1.1) contrast(0.9) saturate(0.6); }
  .leaflet-popup-content-wrapper { border-radius: 0; box-shadow: none; border: 1px solid var(--color-divider); }
  .leaflet-popup-tip { display: none; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--color-text); }
  .hark-popup .name { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 14px; margin-bottom: 2px; }
  .hark-popup .meta { font-family: 'Roboto Mono', ui-monospace, monospace; font-size: 11px; opacity: 0.7; }
</style>
</head>
<body>
<div id="map"></div>
<script>
  var locations = (window.HarkData && window.HarkData.locations) || [];
  var map = L.map('map', { scrollWheelZoom: false });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 18
  }).addTo(map);

  if (locations.length) {
    var bounds = L.latLngBounds(locations.map(function (l) { return [l.lat, l.lng]; }));
    map.fitBounds(bounds, { padding: [50, 50] });
  } else {
    map.setView([38, -95], 4);
  }

  locations.forEach(function (loc) {
    var count = window.HarkData.countForLocation(loc.id);
    var marker = L.circleMarker([loc.lat, loc.lng], {
      radius: 7, weight: 2, color: '#f3f2f2', fillColor: '#ec3013', fillOpacity: 1
    }).addTo(map);
    marker.bindPopup(
      '<div class="hark-popup"><div class="name">' + loc.name + '</div>' +
      '<div class="meta">' + loc.place + ' \u00b7 ' + count + (count === 1 ? ' obs' : ' obs') + (loc.hotspot ? ' \u00b7 Hotspot' : '') + '</div></div>'
    );
  });
</script>
</body>
</html>
